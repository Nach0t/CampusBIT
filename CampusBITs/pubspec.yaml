name: campus_bit_app
description: "Campus Bit App para gestión de menús y compras."

publish_to: "none" # Este paquete no se publicará en pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0" # Dart 3.6+ (Flutter 3.27 o superior)

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.2.9
  path: ^1.8.3
  provider: ^6.1.2 # Cambiada a una versión compatible
  uuid: ^3.0.6
  qr_flutter: ^4.0.0
  sembast: ^3.2.1
  sembast_web: ^2.4.0+4
  qr: ^2.1.0


dev_dependencies:
  sqflite_common_ffi: ^2.0.1 # Solo para los tests (SQLite en memoria en el PC)
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1 # Lints para mantener el código limpio y consistente

flutter:
  uses-material-design: true # Habilita Material Design para la app

  # Archivos de recursos de la app
  assets:
    - assets/



  # Configuración de fuentes personalizadas
  fonts:
    - family: Exo2
      # Pesos estáticos: las negritas se ven reales y no sintéticas.
      fonts:
        - asset: fonts/Exo_2/static/Exo2-Regular.ttf
          weight: 400
        - asset: fonts/Exo_2/static/Exo2-Medium.ttf
          weight: 500
        - asset: fonts/Exo_2/static/Exo2-SemiBold.ttf
          weight: 600
        - asset: fonts/Exo_2/static/Exo2-Bold.ttf
          weight: 700
        - asset: fonts/Exo_2/static/Exo2-Italic.ttf
          weight: 400
          style: italic
